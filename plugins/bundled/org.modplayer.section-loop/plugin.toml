identifier    = "org.modplayer.section-loop"
name          = "Section Loop"
description   = "Drop A and B around a passage and drill it hands-free."
version       = "1.0.0"
api           = "1.3"
author        = "ModPlayer project"
license       = "MIT OR Apache-2.0"
source        = "bundled"
entry         = "main.luau"
default_locale = "en-US"

[[permissions.required]]
permission    = "playback.observe"
justification = "Reads the playhead position to set A/B and cues at the current position, and to keep Status current."

[[permissions.required]]
permission    = "transport.control"
justification = "Requests transport focus before arming the loop or jumping to a cue (FR-008); arms/disarms the loop it owns."

[[permissions.required]]
permission    = "markers.read"
justification = "Lists markers and regions (its own and the host's) to rebuild its panel, marker list and overlays after every change."

[[permissions.required]]
permission    = "markers.write"
justification = "Creates/moves the A/B endpoints and repeat count of its loop region, and sets/clears its own cue markers."

[[permissions.required]]
permission    = "ui.panel"
justification = "Registers the Section Loop panel: Set A, Set B, Loop, Repeat, marker list, Snap note and Status."

[[permissions.required]]
permission    = "ui.overlay"
justification = "Draws the A/B lines, the loop region, and cue dots/labels on the waveform."

[[permissions.required]]
permission    = "ui.shortcuts"
justification = "Registers its 23 trigger actions: Set A/B, Loop toggle, nudge earlier/later, 8 set-cue, 8 jump-cue, clear markers and the inert snap toggle."

[[permissions.optional]]
permission    = "analysis.read"
justification = "Reserved for beat snapping in a later update; not called."

