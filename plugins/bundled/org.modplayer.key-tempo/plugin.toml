step_note_text = "+ / - still steps by the default 10% until rebound in Settings › Controls"
node_removed_text = "Effect node removed — disable and re-enable Key & Tempo to recreate it"
key_up = "Key up"
key_down = "Key down"
tempo_up = "Tempo up"
tempo_down = "Tempo down"
reset_key = "Reset key"
reset_tempo = "Reset tempo"
action_key_up = "Key Up"
