identifier    = "org.modplayer.key-tempo"
name          = "Key & Tempo"
description   = "Transpose a song or change its tempo without changing the rest."
version       = "1.0.0"
api           = "1.4"
author        = "ModPlayer project"
license       = "MIT OR Apache-2.0"
source        = "bundled"
entry         = "main.luau"
default_locale = "en-US"

[[permissions.required]]
permission    = "audio.effects"
justification = "Creates and drives its one pitch-shift and one time-stretch node; observes every change to them."

[[permissions.required]]
permission    = "ui.panel"
justification = "Registers the Key & Tempo panel."

[[permissions.required]]
permission    = "ui.shortcuts"
justification = "Registers its 8 trigger actions (tempo up/down default + / -)."

[[permissions.required]]
permission    = "state.track"
justification = "Stores and restores a track's key/tempo when 'Remember for this track' is on."

[[permissions.required]]
permission    = "playback.observe"
justification = "Reacts to track changes and reads the current track to restore or reset its settings."

[strings.en-US]
panel_title = "Key & Tempo"
key = "Key"
cents = "Fine tune"
tempo = "Tempo"
