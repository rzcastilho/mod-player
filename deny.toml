[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # ttf-parser (pulled in transitively via ab_glyph -> sctk-adwaita ->
    # winit, Linux-only window-decoration text rendering) has no maintained
    # replacement upstream ("No safe upgrade is available!"); not on the
    # real-time audio path, so accepted until eframe/winit move off it.
    "RUSTSEC-2026-0192",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    # Pulled in transitively by the eframe/egui/cpal stack (not our own
    # crates, which all stay MIT OR Apache-2.0 per workspace.package):
    "BSL-1.0",      # clipboard-win, error-code (via arboard, Windows clipboard)
    "ISC",          # libloading (via wgpu-hal/ash and friends)
    "MPL-2.0",      # option-ext (via directories/dirs-sys, weak/file-level copyleft, unmodified)
    "OFL-1.1",      # epaint_default_fonts' bundled Ubuntu font glyphs
    "Ubuntu-font-1.0", # epaint_default_fonts' bundled Ubuntu font glyphs
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
