# Permission catalog (25 entries; data-model.md §1.1, FR-015)
# ---------------------------------------------------------------------------
# `operable = true` marks the 9 permissions this slice actually implements
# calls for; every other permission is still a valid, grantable catalog
# entry (a manifest requesting it is not an error) — every call needing it
# is simply refused at call time until a later slice implements it.

