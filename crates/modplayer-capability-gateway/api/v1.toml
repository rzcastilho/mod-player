# THE single machine-readable definition of ModPlayer's plugin API
# (Constitution IX; 009-plugin-runtime-and-permissions, research R6).
#
# `build.rs` parses this file into `OUT_DIR/generated.rs` (`Permission`,
# `RequestKind`, `EventKind`). `tests/api_reference.rs` regenerates and
# checks `docs/plugin-api/v1.md` against it — that file is never
# hand-edited. See `specs/009-plugin-runtime-and-permissions/contracts/
# plugin-api-v1.md` for the human-authored rendering this must match.
#
# Any change to this file requires the written change request Constitution
# IX asks for (see `.github/PULL_REQUEST_TEMPLATE.md`).

# The closed six-code refusal set (FR-008). The `RefusalCode` enum itself
# is hand-written in `src/refusal.rs` (it is not generated); this list is
# carried here purely so the generated reference documents it alongside
# the requests/events that can return it.
refusal_codes = [
    "permission_denied",
    "no_focus",
    "invalid_state",
    "not_found",
    "rate_limited",
    "budget_exceeded",
]

[api_version]
major = 1
minor = 0

