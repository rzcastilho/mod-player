# ---------------------------------------------------------------------------
# Requests (data-model.md §1.4; contracts/plugin-api-v1.md §3)
# ---------------------------------------------------------------------------
# `name` is the generated `RequestKind` variant (PascalCase); `namespace`/
# `method` are the Lua-facing `api.<namespace>.<method>(...)` path (an
# empty namespace means a call directly on `api`, e.g. `debug_probe`).
# `requires` omitted means no permission is needed (only timers and
# `debug_probe`, per data-model.md §1.1). `category` is one of the five
# `RateCategory` variants (limiter.rs) that every request — including the
# locally served ones — is rate-limited under (G5).

