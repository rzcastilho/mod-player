[package]
name = "modplayer-account"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
modplayer-secure-store = { path = "../modplayer-secure-store", version = "0.1.0" }
modplayer-audio-source = { path = "../modplayer-audio-source", version = "0.1.0" }
ureq.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
base64.workspace = true
getrandom.workspace = true
# `formatting`/`parsing` back the RFC 3339 timestamps in the
# `session-credential` secure-store payload and `account.toml`
# (credential.rs, state_store.rs) — the workspace-wide `time` dependency
# carries no features by default.
time = { workspace = true, features = ["formatting", "parsing"] }
toml.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
